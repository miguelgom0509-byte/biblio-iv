<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BiblioTech | Sistema de Gestión</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4f46e5; --primary-hover: #4338ca; --bg-body: #f3f4f6;
            --bg-sidebar: #111827; --surface: #ffffff; --text-main: #1f2937;
            --text-muted: #6b7280; --border: #e5e7eb; --success: #10b981;
            --danger: #ef4444; --radius: 12px;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        /* --- SIDEBAR --- */
        .sidebar { width: 260px; background-color: var(--bg-sidebar); color: white; display: flex; flex-direction: column; }
        .sidebar-header { padding: 24px; display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar-header i { color: #818cf8; }
        .nav-menu { padding: 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
        .nav-item { padding: 12px 16px; border-radius: 8px; color: #9ca3af; cursor: pointer; display: flex; align-items: center; gap: 12px; transition: 0.2s; text-decoration: none; font-weight: 500;}
        .nav-item:hover, .nav-item.active { background-color: rgba(255,255,255,0.1); color: white; }
        .nav-item.active { background-color: var(--primary); }

        /* --- MAIN CONTENT --- */
        .main-content { flex: 1; overflow-y: auto; padding: 32px; position: relative; }
        .page-section { display: none; animation: fadeIn 0.3s ease; }
        .page-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .page-title { font-size: 24px; font-weight: 700; }

        /* --- DASHBOARD STATS --- */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 32px; }
        .stat-card { background: var(--surface); padding: 24px; border-radius: var(--radius); box-shadow: var(--shadow-sm); display: flex; align-items: center; gap: 20px; border: 1px solid var(--border); }
        .stat-icon { width: 56px; height: 56px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .stat-icon.blue { background: #e0e7ff; color: #4f46e5; }
        .stat-icon.green { background: #d1fae5; color: #059669; }
        .stat-icon.orange { background: #ffedd5; color: #ea580c; }
        .stat-info h3 { font-size: 14px; color: var(--text-muted); font-weight: 500; margin-bottom: 4px; }
        .stat-info p { font-size: 24px; font-weight: 700; }

        /* --- CARDS & TABLES --- */
        .card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow-sm); border: 1px solid var(--border); overflow: hidden; margin-bottom: 24px; }
        .card-header { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: #f9fafb; }
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 16px 24px; border-bottom: 1px solid var(--border); font-size: 14px; }
        th { background: #f9fafb; font-weight: 600; color: var(--text-muted); text-transform: uppercase; font-size: 12px; letter-spacing: 0.5px; }
        tbody tr:hover { background: #f9fafb; }
        tbody tr:last-child td { border-bottom: none; }

        /* --- FORMS & BUTTONS --- */
        .input-group { display: flex; gap: 12px; align-items: center; }
        input[type="text"], input[type="number"], select { padding: 10px 16px; border: 1px solid var(--border); border-radius: 8px; outline: none; transition: 0.2s; font-size: 14px; }
        input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2); }

        .btn { padding: 10px 20px; border-radius: 8px; border: none; font-weight: 600; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: 0.2s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-danger { background: #fee2e2; color: var(--danger); }
        .btn-danger:hover { background: #fecaca; }
        .btn-icon { padding: 8px; border-radius: 6px; }

        /* --- MODAL --- */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(2px); }
        .modal-overlay.active { display: flex; }
        .modal { background: var(--surface); width: 100%; max-width: 500px; border-radius: var(--radius); box-shadow: var(--shadow-lg); padding: 24px; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .modal-header { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .modal-title { font-size: 18px; font-weight: 600; }
        .close-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-muted); }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 500; }
        .form-group input { width: 100%; }

        /* --- TOASTS --- */
        #toast-container { position: fixed; top: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 12px; }
        .toast { padding: 16px 24px; border-radius: 8px; color: white; font-weight: 500; box-shadow: var(--shadow-md); display: flex; align-items: center; gap: 12px; animation: slideIn 0.3s ease forwards; }
        .toast.success { background: var(--success); }
        .toast.error { background: var(--danger); }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
        @keyframes fadeOut { to { opacity: 0; transform: translateX(100%); } }
    </style>
</head>
<body>

<aside class="sidebar">
    <div class="sidebar-header"><i class="fa-solid fa-book-open"></i> BiblioTech</div>
    <nav class="nav-menu">
        <a href="#" class="nav-item active" onclick="switchTab('dashboard', this)"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
        <a href="#" class="nav-item" onclick="switchTab('catalogo', this)"><i class="fa-solid fa-book"></i> Catálogo</a>
        <a href="#" class="nav-item" onclick="switchTab('prestamos', this)"><i class="fa-solid fa-hand-holding-hand"></i> Préstamos</a>
    </nav>
</aside>

<main class="main-content">
    <!-- 1. DASHBOARD -->
    <section id="dashboard" class="page-section active">
        <div class="page-header"><h1 class="page-title">Resumen General</h1></div>
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon blue"><i class="fa-solid fa-book"></i></div>
                <div class="stat-info"><h3>Total Libros</h3><p id="stat-total-libros">0</p></div>
            </div>
            <div class="stat-card">
                <div class="stat-icon green"><i class="fa-solid fa-users"></i></div>
                <div class="stat-info"><h3>Estudiantes</h3><p>124</p></div>
            </div>
            <div class="stat-card">
                <div class="stat-icon orange"><i class="fa-solid fa-clock-rotate-left"></i></div>
                <div class="stat-info"><h3>Préstamos Activos</h3><p id="stat-prestamos">0</p></div>
            </div>
        </div>
    </section>

    <!-- 2. CATÁLOGO -->
    <section id="catalogo" class="page-section">
        <div class="page-header">
            <h1 class="page-title">Catálogo de Libros</h1>
            <button class="btn btn-primary" onclick="abrirModalLibro()"><i class="fa-solid fa-plus"></i> Agregar Libro</button>
        </div>

        <div class="card">
            <div class="card-header">
                <div class="input-group">
                    <i class="fa-solid fa-search" style="color:var(--text-muted)"></i>
                    <input type="text" id="buscadorLibros" placeholder="Buscar por título o autor..." onkeyup="filtrarLibros()" style="width: 300px;">
                </div>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                    <tr><th>ID</th><th>Título</th><th>Autor</th><th>Categoría</th><th>Año</th><th>Acciones</th></tr>
                    </thead>
                    <tbody id="tablaLibrosBody">
                    <!-- Se llena con JS desde Spring Boot -->
                    </tbody>
                </table>
            </div>
        </div>
    </section>

    <!-- 3. PRÉSTAMOS (Simulados localmente) -->
    <section id="prestamos" class="page-section">
        <div class="page-header"><h1 class="page-title">Gestión de Préstamos</h1></div>
        <div class="card" style="margin-bottom: 24px; padding: 24px;">
            <h3 style="margin-bottom: 16px; font-size: 16px;">Registrar Nuevo Préstamo</h3>
            <div style="display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-end;">
                <div class="form-group" style="margin:0; flex: 1; min-width: 200px;">
                    <label>Nombre del Estudiante</label>
                    <input type="text" id="nombreLector" placeholder="Ej. Juan Pérez" style="width: 100%;">
                </div>
                <div class="form-group" style="margin:0; flex: 1; min-width: 200px;">
                    <label>Libro a Prestar</label>
                    <select id="libroPrestamo" style="width: 100%;">
                        <option value="">Seleccione un libro...</option>
                    </select>
                </div>
                <button class="btn btn-primary" onclick="registrarPrestamo()" style="height: 42px;"><i class="fa-solid fa-save"></i> Registrar</button>
            </div>
        </div>
        <div class="card">
            <div class="card-header"><h3 style="font-size: 16px;">Préstamos Activos</h3></div>
            <div class="table-container">
                <table>
                    <thead>
                    <tr><th>Libro</th><th>Estudiante</th><th>Fecha Préstamo</th><th>Acciones</th></tr>
                    </thead>
                    <tbody id="tablaPrestamosBody"></tbody>
                </table>
            </div>
        </div>
    </section>
</main>

<!-- MODAL AGREGAR LIBRO -->
<div class="modal-overlay" id="modalLibro">
    <div class="modal">
        <div class="modal-header">
            <h2 class="modal-title">Agregar Nuevo Libro</h2>
            <button class="close-btn" onclick="cerrarModalLibro()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="form-group">
            <label>Título del Libro</label>
            <input type="text" id="nuevoTitulo" placeholder="Ej. Cien Años de Soledad">
        </div>
        <div class="form-group">
            <label>Autor</label>
            <input type="text" id="nuevoAutor" placeholder="Ej. Gabriel García Márquez">
        </div>
        <div class="form-group">
            <label>Categoría</label>
            <input type="text" id="nuevaCategoria" placeholder="Ej. Novela">
        </div>
        <div class="form-group">
            <label>Año</label>
            <input type="number" id="nuevoAnio" placeholder="Ej. 1967">
        </div>
        <button class="btn btn-primary" style="width: 100%; justify-content: center;" onclick="guardarLibroBackend()">Guardar Libro en Base de Datos</button>
    </div>
</div>

<div id="toast-container"></div>

<script>
    // Variables globales
    let librosGlobales = [];
    let prestamos = []; // Préstamos locales simulados

    // --- NAVEGACIÓN Y UI ---
    function switchTab(tabId, element) {
        document.querySelectorAll('.page-section').forEach(sec => sec.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        element.classList.add('active');
        if(tabId === 'dashboard') actualizarDashboard();
    }

    function showToast(mensaje, tipo = 'success') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = `toast ${tipo}`;
        toast.innerHTML = `<i class="fa-solid ${tipo === 'success' ? 'fa-check-circle' : 'fa-circle-exclamation'}"></i> ${mensaje}`;
        container.appendChild(toast);
        setTimeout(() => {
            toast.style.animation = 'fadeOut 0.3s ease forwards';
            setTimeout(() => toast.remove(), 300);
        }, 3000);
    }

    // ==========================================
    // CONEXIÓN CON SPRING BOOT (Backend)
    // ==========================================

    // 1. GET: Cargar libros
    async function cargarLibrosBackend() {
        try {
            const respuesta = await fetch('/libros');
            if (!respuesta.ok) throw new Error('Error al conectar con el servidor');
            librosGlobales = await respuesta.json();
            renderizarLibros(librosGlobales);
            actualizarDashboard();
        } catch (error) {
            console.error(error);
            showToast('No se pudieron cargar los libros del servidor', 'error');
        }
    }

    // 2. POST: Guardar libro
    async function guardarLibroBackend() {
        const titulo = document.getElementById('nuevoTitulo').value;
        const autor = document.getElementById('nuevoAutor').value;
        const categoria = document.getElementById('nuevaCategoria').value;
        const anio = document.getElementById('nuevoAnio').value;

        if(!titulo || !autor) return showToast('Título y autor son obligatorios', 'error');

        // Creamos el objeto igual que la clase Libro de Java
        const nuevoLibro = {
            titulo: titulo,
            autor: autor,
            categoria: categoria,
            anio: anio ? parseInt(anio) : 0
        };

        try {
            const respuesta = await fetch('/libros', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(nuevoLibro)
            });

            if (!respuesta.ok) throw new Error('Error al guardar');

            cerrarModalLibro();
            cargarLibrosBackend(); // Recargar la tabla con los datos actualizados
            showToast('Libro guardado exitosamente', 'success');
        } catch (error) {
            console.error(error);
            showToast('Error al guardar el libro en el servidor', 'error');
        }
    }

    // 3. DELETE: Eliminar libro
    async function eliminarLibroBackend(id) {
        if(confirm('¿Estás seguro de eliminar este libro de la base de datos?')) {
            try {
                const respuesta = await fetch(`/libros/${id}`, { method: 'DELETE' });
                if (!respuesta.ok) throw new Error('Error al eliminar');

                cargarLibrosBackend(); // Recargar la tabla
                showToast('Libro eliminado correctamente', 'success');
            } catch (error) {
                console.error(error);
                showToast('Error al eliminar el libro', 'error');
            }
        }
    }

    // --- RENDERIZADO EN PANTALLA ---
    function renderizarLibros(librosAMostrar) {
        const tbody = document.getElementById('tablaLibrosBody');
        tbody.innerHTML = '';

        librosAMostrar.forEach(libro => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${libro.id}</td>
                <td style="font-weight: 500;">${libro.titulo}</td>
                <td>${libro.autor}</td>
                <td>${libro.categoria}</td>
                <td>${libro.anio}</td>
                <td>
                    <button class="btn btn-danger btn-icon" onclick="eliminarLibroBackend(${libro.id})" title="Eliminar"><i class="fa-solid fa-trash"></i></button>
                </td>
            `;
            tbody.appendChild(tr);
        });

        actualizarSelectLibros();
    }

    function filtrarLibros() {
        const texto = document.getElementById('buscadorLibros').value.toLowerCase();
        const filtrados = librosGlobales.filter(l =>
            l.titulo.toLowerCase().includes(texto) ||
            l.autor.toLowerCase().includes(texto)
        );
        renderizarLibros(filtrados);
    }

    // --- MODAL ---
    function abrirModalLibro() { document.getElementById('modalLibro').classList.add('active'); }
    function cerrarModalLibro() {
        document.getElementById('modalLibro').classList.remove('active');
        document.getElementById('nuevoTitulo').value = '';
        document.getElementById('nuevoAutor').value = '';
        document.getElementById('nuevaCategoria').value = '';
        document.getElementById('nuevoAnio').value = '';
    }

    // --- LÓGICA DE PRÉSTAMOS (Local) ---
    function actualizarSelectLibros() {
        const select = document.getElementById('libroPrestamo');
        select.innerHTML = '<option value="">Seleccione un libro...</option>';
        librosGlobales.forEach(libro => {
            const option = document.createElement('option');
            option.value = libro.id;
            option.textContent = libro.titulo;
            select.appendChild(option);
        });
    }

    function registrarPrestamo() {
        const nombre = document.getElementById('nombreLector').value;
        const libroId = document.getElementById('libroPrestamo').value;
        if(!nombre || !libroId) return showToast('Complete todos los campos', 'error');

        const libroSeleccionado = librosGlobales.find(l => l.id == libroId);
        const nuevaFecha = new Date().toISOString().split('T')[0];

        prestamos.push({
            id: Date.now(),
            libroTitulo: libroSeleccionado.titulo,
            estudiante: nombre,
            fecha: nuevaFecha
        });

        document.getElementById('nombreLector').value = '';
        document.getElementById('libroPrestamo').value = '';

        renderizarPrestamos();
        showToast(`Préstamo registrado: ${libroSeleccionado.titulo}`, 'success');
    }

    function renderizarPrestamos() {
        const tbody = document.getElementById('tablaPrestamosBody');
        tbody.innerHTML = '';
        prestamos.forEach((prestamo, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="font-weight: 500;">${prestamo.libroTitulo}</td>
                <td>${prestamo.estudiante}</td>
                <td>${prestamo.fecha}</td>
                <td><button class="btn btn-danger btn-icon" onclick="devolverLibro(${index})" title="Devolver"><i class="fa-solid fa-arrow-rotate-left"></i></button></td>
            `;
            tbody.appendChild(tr);
        });
        actualizarDashboard();
    }

    function devolverLibro(index) {
        prestamos.splice(index, 1);
        renderizarPrestamos();
        showToast('Libro devuelto correctamente', 'success');
    }

    function actualizarDashboard() {
        document.getElementById('stat-total-libros').textContent = librosGlobales.length;
        document.getElementById('stat-prestamos').textContent = prestamos.length;
    }

    // --- INICIALIZACIÓN ---
    // Cuando la página termine de cargar, pide los datos a Spring Boot
    document.addEventListener('DOMContentLoaded', () => {
        cargarLibrosBackend();
    });
</script>
</body>
</html>
