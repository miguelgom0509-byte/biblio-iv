<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BiblioTech | Sistema de Gestión</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>
    <style>
        :root{--primary:#4f46e5;--primary-hover:#4338ca;--primary-soft:#eef2ff;--bg-body:#f3f4f6;--bg-sidebar:#111827;--surface:#fff;--surface-2:#f9fafb;--text-main:#1f2937;--text-muted:#6b7280;--border:#e5e7eb;--success:#10b981;--danger:#ef4444;--warning:#f59e0b;--radius:14px;--shadow-sm:0 1px 2px 0 rgb(0 0 0/.05);--shadow-md:0 6px 12px -2px rgb(0 0 0/.12);--shadow-lg:0 18px 30px -6px rgb(0 0 0/.22)}
        [data-theme="dark"]{--bg-body:#0f172a;--surface:#1e293b;--surface-2:#162033;--primary-soft:#312e81;--text-main:#f1f5f9;--text-muted:#94a3b8;--border:#334155}
        *{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',sans-serif;transition:background-color .3s,color .3s,border-color .3s}
        body{background:var(--bg-body);color:var(--text-main);display:flex;height:100vh;overflow:hidden}
        :focus-visible{outline:2px solid var(--primary);outline-offset:2px}
        button{font-family:inherit}
        #root{display:flex;width:100%;height:100vh}

        .sidebar{width:260px;background:linear-gradient(180deg,#111827,#0b1220);color:#fff;display:flex;flex-direction:column;flex-shrink:0}
        .sidebar-header{padding:24px;display:flex;align-items:center;gap:12px;font-size:20px;font-weight:800;border-bottom:1px solid rgba(255,255,255,.1)}
        .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#6366f1,#a855f7);display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 6px 14px rgba(99,102,241,.45)}
        .nav-menu{padding:16px;display:flex;flex-direction:column;gap:6px;flex:1}
        .nav-item{padding:12px 16px;border-radius:10px;color:#9ca3af;cursor:pointer;display:flex;align-items:center;gap:12px;transition:.2s;font-weight:500;border:none;background:transparent;width:100%;text-align:left;font-size:14px}
        .nav-item i{width:20px;text-align:center}
        .nav-item:hover{background:rgba(255,255,255,.08);color:#fff;transform:translateX(3px)}
        .nav-item.active{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;box-shadow:0 6px 14px rgba(79,70,229,.4)}
        .nav-badge{margin-left:auto;background:rgba(255,255,255,.18);border-radius:999px;font-size:11px;padding:2px 8px;font-weight:700}
        .theme-toggle{padding:16px;border-top:1px solid rgba(255,255,255,.1)}
        .theme-btn{width:100%;padding:10px;border-radius:10px;border:1px solid #374151;background:transparent;color:#9ca3af;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:500;transition:.2s}
        .theme-btn:hover{background:rgba(255,255,255,.06);color:#fff}
        .mode-badge{padding:10px 12px;background:rgba(255,255,255,.06);border-radius:10px;font-size:12px;color:#9ca3af;margin-bottom:8px;display:flex;align-items:center;gap:8px}
        .mode-badge span{flex:1;line-height:1.3}
        .mode-badge .reset-btn{background:transparent;border:none;color:#9ca3af;cursor:pointer;padding:4px;border-radius:6px;transition:.2s}
        .mode-badge .reset-btn:hover{background:rgba(255,255,255,.1);color:#fff}

        .main-content{flex:1;overflow-y:auto;padding:32px;position:relative}
        .page-section{animation:fadeIn .35s ease}
        @keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
        .page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;gap:12px;flex-wrap:wrap}
        .page-title{font-size:26px;font-weight:800;letter-spacing:-.5px}
        .page-sub{color:var(--text-muted);font-size:14px;margin-top:2px}

        .hero{position:relative;overflow:hidden;border-radius:20px;padding:32px;margin-bottom:28px;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:24px;background:linear-gradient(120deg,#4f46e5 0%,#7c3aed 55%,#db2777 120%);box-shadow:var(--shadow-lg)}
        .hero::before{content:'';position:absolute;width:340px;height:340px;border-radius:50%;background:rgba(255,255,255,.1);top:-140px;right:60px}
        .hero::after{content:'';position:absolute;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.08);bottom:-90px;left:38%}
        .hero-text{position:relative;z-index:1;max-width:460px}
        .hero-text h2{font-size:28px;font-weight:800;line-height:1.15;margin-bottom:8px}
        .hero-text p{opacity:.9;line-height:1.5;margin-bottom:18px;font-size:15px}
        .hero-actions{display:flex;gap:10px;flex-wrap:wrap}
        .hero svg{position:relative;z-index:1;width:320px;max-width:40%;height:auto;flex-shrink:0;filter:drop-shadow(0 10px 14px rgba(0,0,0,.25))}
        .book-float{animation:float 4s ease-in-out infinite;transform-origin:bottom center}
        .book-float:nth-child(2){animation-delay:.4s}.book-float:nth-child(3){animation-delay:.8s}
        .book-float:nth-child(4){animation-delay:1.2s}.book-float:nth-child(5){animation-delay:1.6s}
        @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

        .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-bottom:28px}
        .stat-card{background:var(--surface);padding:22px;border-radius:var(--radius);box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:18px;border:1px solid var(--border);transition:transform .25s,box-shadow .25s}
        .stat-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-md)}
        .stat-icon{width:54px;height:54px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
        .stat-icon.blue{background:#e0e7ff;color:#4f46e5}.stat-icon.green{background:#d1fae5;color:#059669}
        .stat-icon.orange{background:#ffedd5;color:#ea580c}.stat-icon.red{background:#fee2e2;color:#dc2626}
        .stat-info h3{font-size:13px;color:var(--text-muted);font-weight:500;margin-bottom:4px}
        .stat-info p{font-size:28px;font-weight:800}

        .dash-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:24px}
        .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow-sm);margin-bottom:24px}
        .panel h3{font-size:16px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
        .bar-row{display:grid;grid-template-columns:130px 1fr 44px;align-items:center;gap:12px;margin-bottom:12px;font-size:13px}
        .bar-label{color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .bar-track{background:var(--surface-2);border-radius:999px;height:12px;overflow:hidden;border:1px solid var(--border)}
        .bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,hsl(var(--h) 75% 55%),hsl(calc(var(--h) + 40) 75% 45%));width:0;transition:width .9s cubic-bezier(.2,.8,.2,1)}
        .bar-value{font-weight:700;text-align:right}
        .mini-list{display:flex;flex-direction:column;gap:12px}
        .mini-item{display:flex;align-items:center;gap:12px;padding:8px;border-radius:10px;transition:background .2s}
        .mini-item:hover{background:var(--surface-2)}
        .mini-item .info{flex:1;min-width:0}
        .mini-item .info strong{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .mini-item .info span{font-size:12px;color:var(--text-muted)}

        .cover{position:relative;aspect-ratio:2/3;border-radius:4px 12px 12px 4px;overflow:hidden;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:14px 12px 12px 22px;background:linear-gradient(145deg,hsl(var(--h) 70% 48%),hsl(calc(var(--h) + 45) 70% 27%));box-shadow:0 8px 18px -6px rgba(0,0,0,.45),inset -2px 0 0 rgba(255,255,255,.1)}
        .cover::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 82% 14%,rgba(255,255,255,.3),transparent 46%),repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 8px,transparent 8px 16px)}
        .cover-spine{position:absolute;left:0;top:0;bottom:0;width:11px;background:linear-gradient(90deg,rgba(0,0,0,.4),rgba(255,255,255,.14))}
        .cover-icon{position:absolute;top:14px;right:14px;font-size:26px;opacity:.85}
        .cover-title{position:relative;z-index:1;font-weight:800;line-height:1.15;font-size:15px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 1px 3px rgba(0,0,0,.3)}
        .cover-author{position:relative;z-index:1;font-size:11px;opacity:.88;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2}
        .cover-sm{width:40px;padding:0;justify-content:center;align-items:center;border-radius:3px 6px 6px 3px;flex-shrink:0}
        .cover-sm .cover-title,.cover-sm .cover-author,.cover-sm .cover-spine{display:none}
        .cover-sm .cover-icon{position:static;font-size:15px;z-index:1}
        .cover-md{width:54px;padding:6px 4px 6px 9px;flex-shrink:0}
        .cover-md .cover-title{font-size:7px;-webkit-line-clamp:2}
        .cover-md .cover-author{display:none}
        .cover-md .cover-icon{font-size:11px;top:6px;right:6px}
        .cover-md .cover-spine{width:5px}
        .cover-lg{width:150px}

        .toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:14px}
        .search-box{position:relative;flex:1;min-width:220px}
        .search-box i{position:absolute;left:14px;top:13px;color:var(--text-muted);pointer-events:none}
        .search-box input{padding-left:38px;width:100%}
        .search-box kbd{position:absolute;right:10px;top:9px;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:2px 8px;font-size:12px;color:var(--text-muted);font-family:inherit}
        .toolbar select{width:auto;min-width:150px}
        .view-toggle{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--surface)}
        .view-toggle button{border:none;background:transparent;color:var(--text-muted);padding:10px 14px;cursor:pointer;font-size:15px;transition:.2s}
        .view-toggle button.active{background:var(--primary);color:#fff}
        .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
        .chip-btn{border:1px solid var(--border);background:var(--surface);color:var(--text-muted);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer;transition:.2s}
        .chip-btn:hover{border-color:var(--primary);color:var(--primary);transform:translateY(-1px)}
        .chip-btn.active{background:var(--primary);border-color:var(--primary);color:#fff}
        .result-count{color:var(--text-muted);font-size:13px;margin-bottom:14px}

        .books-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:22px}
        .book-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow-sm);transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s;animation:cardIn .5s ease backwards;animation-delay:calc(var(--i,0) * 45ms)}
        .book-card:hover{transform:translateY(-8px);box-shadow:var(--shadow-lg)}
        @keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
        .cover-wrap{position:relative;perspective:800px}
        .cover-wrap .cover{transition:transform .4s;transform-origin:left center}
        .book-card:hover .cover-wrap .cover{transform:rotateY(-14deg) scale(1.02)}
        .stock-pill{position:absolute;top:8px;left:8px;z-index:3;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700;color:#fff;box-shadow:var(--shadow-md)}
        .stock-pill.ok{background:var(--success)}.stock-pill.low{background:var(--warning)}.stock-pill.out{background:var(--danger)}
        .book-body h3{font-size:15px;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
        .book-body .autor{font-size:13px;color:var(--text-muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;font-size:12px;color:var(--text-muted)}
        .tag{background:var(--primary-soft);color:var(--primary);border-radius:999px;padding:3px 10px;font-weight:600;max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        [data-theme="dark"] .tag{color:#c7d2fe}
        .book-actions{display:flex;gap:8px;margin-top:auto}
        .book-actions .btn-prestar{flex:1}

        .skeleton{position:relative;overflow:hidden;background:var(--surface-2);border-radius:10px}
        .skeleton::after{content:'';position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(148,163,184,.25),transparent);animation:shimmer 1.3s infinite}
        @keyframes shimmer{to{transform:translateX(100%)}}
        .sk-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:12px}
        .sk-cover{aspect-ratio:2/3}.sk-line{height:14px}.sk-line.short{width:60%}

        .card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow-sm);border:1px solid var(--border);overflow:hidden;margin-bottom:24px}
        .card-header{padding:16px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;background:var(--surface-2);gap:12px;flex-wrap:wrap}
        .table-container{overflow-x:auto;min-height:120px}
        table{width:100%;border-collapse:collapse;text-align:left}
        th,td{padding:14px 20px;border-bottom:1px solid var(--border);font-size:14px;vertical-align:middle}
        th{background:var(--surface-2);font-weight:600;color:var(--text-muted);text-transform:uppercase;font-size:12px;letter-spacing:.5px;white-space:nowrap}
        th.sortable{cursor:pointer;user-select:none}
        th.sortable:hover{color:var(--primary)}
        th.sortable i{margin-left:6px;font-size:10px;opacity:.6}
        tbody tr{transition:background .15s}tbody tr:hover{background:var(--surface-2)}
        tbody tr:last-child td{border-bottom:none}
        .cell-book{display:flex;align-items:center;gap:12px;font-weight:600}
        .empty-state{text-align:center;padding:48px 20px;color:var(--text-muted)}
        .empty-state i{font-size:44px;margin-bottom:12px;opacity:.45;display:block}
        .acciones{display:flex;gap:8px}
        .badge{padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;display:inline-block}
        .badge.ok{background:#d1fae5;color:#059669}.badge.low{background:#fef3c7;color:#d97706}.badge.out{background:#fee2e2;color:#dc2626}
        .avatar{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;flex-shrink:0;background:linear-gradient(135deg,hsl(var(--h) 70% 55%),hsl(calc(var(--h) + 40) 70% 40%))}

        .form-group{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
        .form-group label{font-size:13px;font-weight:600;color:var(--text-muted)}
        .form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
        input[type="text"],input[type="number"],input[type="url"],select{padding:10px 16px;border:1px solid var(--border);border-radius:10px;outline:none;transition:.2s;font-size:14px;background:var(--surface);color:var(--text-main);width:100%}
        input:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.2)}
        input.invalid{border-color:var(--danger);box-shadow:0 0 0 3px rgba(239,68,68,.15)}
        .field-error{color:var(--danger);font-size:12px}
        .field-hint{color:var(--text-muted);font-size:12px}
        .btn{padding:10px 20px;border-radius:10px;border:none;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.2s;height:42px}
        .btn:active:not(:disabled){transform:scale(.97)}
        .btn-primary{background:var(--primary);color:#fff}.btn-primary:hover:not(:disabled){background:var(--primary-hover);box-shadow:0 6px 14px rgba(79,70,229,.35)}
        .btn:disabled{opacity:.6;cursor:not-allowed}
        .btn-light{background:rgba(255,255,255,.18);color:#fff;backdrop-filter:blur(4px)}.btn-light:hover{background:rgba(255,255,255,.3)}
        .btn-warning{background:#fef3c7;color:#d97706}.btn-warning:hover{background:#fde68a}
        .btn-danger{background:#fee2e2;color:var(--danger)}.btn-danger:hover{background:#fecaca}
        .btn-secondary{background:transparent;border:1px solid var(--border);color:var(--text-main)}.btn-secondary:hover{background:var(--surface-2)}
        .btn-icon{padding:8px;border-radius:8px;height:38px;width:38px}
        .btn-sm{height:38px;padding:0 14px;font-size:13px}

        .loan-layout{display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-items:start}
        .label-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
        .link-btn{background:none;border:none;color:var(--primary);font-weight:600;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:8px;transition:.2s}
        .link-btn:hover{background:var(--primary-soft)}
        [data-theme="dark"] .link-btn{color:#a5b4fc}
        .preview-box{padding:20px;min-height:100%}
        .preview-row{display:flex;gap:18px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
        .stock-meter{height:10px;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;overflow:hidden;margin:6px 0}
        .stock-meter span{display:block;height:100%;border-radius:999px;transition:width .6s}

        .modal-overlay{position:fixed;inset:0;background:rgba(2,6,23,.65);display:flex;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(5px);padding:16px;animation:fadeOverlay .25s ease}
        @keyframes fadeOverlay{from{opacity:0}to{opacity:1}}
        .modal{background:var(--surface);width:100%;max-width:720px;max-height:95vh;overflow-y:auto;border-radius:18px;box-shadow:var(--shadow-lg);padding:26px;animation:slideUp .35s cubic-bezier(.2,.8,.2,1);border:1px solid var(--border)}
        @keyframes slideUp{from{transform:translateY(24px) scale(.97);opacity:0}to{transform:none;opacity:1}}
        .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
        .modal-header h2{font-size:20px;font-weight:800}
        .close-btn{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-muted);width:36px;height:36px;border-radius:50%}
        .close-btn:hover{background:var(--surface-2)}
        .modal-actions{display:flex;gap:12px;margin-top:8px}.modal-actions .btn{flex:1}
        .modal-body{display:grid;grid-template-columns:170px 1fr;gap:24px}
        .modal-preview{display:flex;flex-direction:column;align-items:center;gap:10px}
        .confirm-text{color:var(--text-muted);line-height:1.5;margin-bottom:20px}

        .toast-container{position:fixed;top:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:12px}
        .toast{padding:14px 20px;border-radius:12px;color:#fff;font-weight:500;box-shadow:var(--shadow-md);display:flex;align-items:center;gap:12px;animation:slideIn .35s cubic-bezier(.2,.8,.2,1) forwards;max-width:360px}
        .toast.success{background:var(--success)}.toast.error{background:var(--danger)}
        @keyframes slideIn{from{transform:translateX(110%)}to{transform:none}}
        @keyframes fadeOut{to{opacity:0;transform:translateX(110%)}}
        .toast.exiting{animation:fadeOut .3s ease forwards}
        .spinner{animation:spin 1s linear infinite;display:inline-block}
        @keyframes spin{100%{transform:rotate(360deg)}}

        @media (max-width:1000px){.dash-grid,.loan-layout{grid-template-columns:1fr}.hero svg{display:none}}
        @media (max-width:800px){
          #root{flex-direction:column;height:auto;min-height:100vh;overflow:auto}
          body{display:block;height:auto;overflow:auto}
          .sidebar{width:100%;flex-direction:row;align-items:center;flex-wrap:wrap}
          .sidebar-header{border-bottom:none;padding:14px 16px}
          .nav-menu{flex-direction:row;padding:8px 16px;overflow-x:auto;order:3;width:100%;flex:none}
          .theme-toggle{border-top:none;margin-left:auto;padding:8px 16px;display:flex;gap:8px;flex-wrap:wrap}
          .mode-badge{margin-bottom:0;flex:1}
          .main-content{padding:16px;overflow:visible}
          .form-row,.modal-body{grid-template-columns:1fr}
          .hero{padding:22px}.hero-text h2{font-size:22px}
          th,td{padding:12px 14px}
          .bar-row{grid-template-columns:90px 1fr 38px}
        }
        @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
    </style>
</head>
<body>

<div id="root">
    <div style="display:flex;align-items:center;justify-content:center;width:100%;height:100vh;font-family:Inter,sans-serif;color:#6b7280;flex-direction:column;gap:16px">
        <div style="width:44px;height:44px;border:4px solid #e5e7eb;border-top-color:#4f46e5;border-radius:50%;animation:spin 1s linear infinite"></div>
        <p>Cargando BiblioTech…</p>
        <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    </div>
</div>

<script>
    (function () {
      function mostrarError(msg, stack) {
        var root = document.getElementById('root');
        if (!root || root.querySelector('.sidebar')) return;
        root.innerHTML =
          '<div style="padding:40px;font-family:system-ui,sans-serif;max-width:900px;margin:0 auto;color:#1f2937">' +
          '<h2 style="color:#e11d48;margin-bottom:12px">⚠️ Error al cargar la aplicación</h2>' +
          '<p style="color:#6b7280;margin-bottom:16px">Copia el mensaje de abajo para diagnosticar el problema:</p>' +
          '<pre style="background:#fee;padding:16px;border-radius:8px;overflow:auto;white-space:pre-wrap;font-size:13px;border:1px solid #fecaca">' +
          String(msg).replace(/</g, '&lt;') +
          '\n\n' + String(stack || '').replace(/</g, '&lt;') +
          '</pre></div>';
      }
      window.addEventListener('error', function (e) { mostrarError(e.message, e.error && e.error.stack); });
      window.addEventListener('unhandledrejection', function (e) {
        mostrarError('Promise rechazada: ' + (e.reason && e.reason.message || e.reason), e.reason && e.reason.stack);
      });
      setTimeout(function () {
        var root = document.getElementById('root');
        if (root && !root.querySelector('.sidebar') && !root.querySelector('pre')) {
          mostrarError('React no se inicializó a tiempo.',
            'Verifica tu conexión a internet (los scripts se cargan desde unpkg.com).');
        }
      }, 6000);
    })();
</script>

<script type="text/babel">
    const { useState, useEffect, useMemo, useCallback, useRef, useContext, createContext } = React;

    /* ============================================================
       1. CONFIGURACIÓN Y UTILIDADES
       ============================================================ */
    const MODO_API = 'auto';
    const LS_DATA = 'biblio-data';
    const LS_PORTADAS = 'biblio-portadas';
    const LS_MODO = 'biblio-modo-efectivo';
    const LS_TEMA = 'biblio-tema';
    const LS_VISTA = 'biblio-vista';

    let modoEfectivo = null;
    const modoListeners = new Set();
    function setModo(m) {
      if (modoEfectivo === m) return;
      modoEfectivo = m;
      try { localStorage.setItem(LS_MODO, m); } catch (e) {}
      modoListeners.forEach(function (fn) { fn(m); });
    }
    function suscribirModo(fn) { modoListeners.add(fn); return function () { modoListeners.delete(fn); }; }

    const hash = (s) => { let h = 0; s = String(s ?? ''); for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h; };
    const tono = (t) => hash(t) % 360;
    const iniciales = (n) => { const p = String(n ?? '?').trim().split(/\s+/).slice(0, 2); return p.map(x => x.charAt(0).toUpperCase()).join('') || '?'; };
    const stockDe = (l) => l.stock ?? 0;
    const categoriaDe = (l) => (l.categoria && String(l.categoria).trim()) || 'Sin categoría';
    const iconoCategoria = (c) => {
      c = String(c ?? '').toLowerCase();
      if (/program|c[oó]digo|software|java|python|algoritmo/.test(c)) return 'fa-code';
      if (/web|internet|html/.test(c)) return 'fa-globe';
      if (/prueba|test|calidad/.test(c)) return 'fa-vial-circle-check';
      if (/dato|base|sql/.test(c)) return 'fa-database';
      if (/red|network|cisco/.test(c)) return 'fa-network-wired';
      if (/novela|ficci|cuento|liter/.test(c)) return 'fa-feather-pointed';
      if (/hist/.test(c)) return 'fa-landmark';
      if (/cien|f[ií]sic|qu[ií]mic|biolog/.test(c)) return 'fa-flask';
      if (/mate|calcul/.test(c)) return 'fa-square-root-variable';
      if (/arte|dise[nñ]o/.test(c)) return 'fa-palette';
      return 'fa-book';
    };
    const stockBadge = (s) => s <= 0
      ? { label: 'Agotado', cls: 'out' }
      : s <= 5 ? { label: s + ' (bajo)', cls: 'low' }
      : { label: String(s), cls: 'ok' };

    /* ============================================================
       2. CAPA DE DATOS: backend + fallback localStorage
       ============================================================ */
    function initStore() {
      let store = null;
      try { store = JSON.parse(localStorage.getItem(LS_DATA) || 'null'); } catch (e) {}
      if (!store || !Array.isArray(store.libros)) {
        store = {
          libros: [
            { id: 1, titulo: 'Cien Años de Soledad', autor: 'Gabriel García Márquez', categoria: 'Novela', anio: 1967, stock: 45 },
            { id: 2, titulo: 'El Quijote de la Mancha', autor: 'Miguel de Cervantes', categoria: 'Novela', anio: 1605, stock: 8 },
            { id: 3, titulo: 'Introducción a los Algoritmos', autor: 'Thomas H. Cormen', categoria: 'Programación', anio: 2009, stock: 12 },
            { id: 4, titulo: 'Clean Code', autor: 'Robert C. Martin', categoria: 'Programación', anio: 2008, stock: 3 },
            { id: 5, titulo: 'Sapiens', autor: 'Yuval Noah Harari', categoria: 'Historia', anio: 2011, stock: 20 },
            { id: 6, titulo: 'El Principito', autor: 'Antoine de Saint-Exupéry', categoria: 'Literatura', anio: 1943, stock: 0 },
            { id: 7, titulo: 'Estructuras de Datos y Algoritmos', autor: 'Mark Allen Weiss', categoria: 'Programación', anio: 2013, stock: 15 },
            { id: 8, titulo: 'Redes de Computadoras', autor: 'Andrew S. Tanenbaum', categoria: 'Redes', anio: 2011, stock: 6 }
          ],
          estudiantes: [
            { id: 1, nombre: 'María Quispe Mamani', carrera: 'Desarrollo de Sistemas de Información' },
            { id: 2, nombre: 'Juan Pérez Rojas', carrera: 'Ingeniería de Software' }
          ],
          nextLibroId: 9,
          nextEstudianteId: 3
        };
        try { localStorage.setItem(LS_DATA, JSON.stringify(store)); } catch (e) {}
      }
      return store;
    }
    function saveStore(store) {
      try { localStorage.setItem(LS_DATA, JSON.stringify(store)); } catch (e) {}
    }
    function resetDemoData() {
      try { localStorage.removeItem(LS_DATA); localStorage.removeItem(LS_PORTADAS); } catch (e) {}
      initStore();
    }

    const localApi = {
      async getLibros() { return initStore().libros; },
      async crearLibro(data) {
        const s = initStore();
        const nuevo = Object.assign({ id: s.nextLibroId++ }, data);
        s.libros.push(nuevo); saveStore(s);
        return nuevo;
      },
      async editarLibro(id, data) {
        const s = initStore();
        const i = s.libros.findIndex(function (l) { return String(l.id) === String(id); });
        if (i < 0) throw new Error('Libro no encontrado');
        s.libros[i] = Object.assign({}, s.libros[i], data, { id: s.libros[i].id });
        saveStore(s);
        return s.libros[i];
      },
      async eliminarLibro(id) {
        const s = initStore();
        s.libros = s.libros.filter(function (l) { return String(l.id) !== String(id); });
        saveStore(s);
      },
      async getEstudiantes() { return initStore().estudiantes; },
      async crearEstudiante(data) {
        const s = initStore();
        const nuevo = Object.assign({ id: s.nextEstudianteId++ }, data);
        s.estudiantes.push(nuevo); saveStore(s);
        return nuevo;
      },
      async evaluarPrestamo(idEstudiante, idLibro) {
        const s = initStore();
        const est = s.estudiantes.find(function (e) { return String(e.id) === String(idEstudiante); });
        if (!est) return { autorizado: false, mensaje: 'Estudiante no encontrado' };
        const lib = s.libros.find(function (l) { return String(l.id) === String(idLibro); });
        if (!lib) return { autorizado: false, mensaje: 'Libro no encontrado' };
        if ((lib.stock || 0) <= 0) return { autorizado: false, mensaje: 'No hay ejemplares disponibles' };
        lib.stock = (lib.stock || 0) - 1;
        saveStore(s);
        return { autorizado: true, mensaje: 'Préstamo autorizado: "' + lib.titulo + '" a ' + est.nombre };
      }
    };

    async function routeLocal(url, options) {
      const method = (options && options.method) || 'GET';
      const body = options && options.body ? JSON.parse(options.body) : null;
      if (url === '/libros' && method === 'GET') return localApi.getLibros();
      if (url === '/libros' && method === 'POST') return localApi.crearLibro(body);
      if (/^\/libros\/[^/]+$/.test(url) && method === 'PUT') return localApi.editarLibro(url.split('/')[2], body);
      if (/^\/libros\/[^/]+$/.test(url) && method === 'DELETE') return localApi.eliminarLibro(url.split('/')[2]);
      if (url === '/estudiantes' && method === 'GET') return localApi.getEstudiantes();
      if (url === '/estudiantes' && method === 'POST') return localApi.crearEstudiante(body);
      if (url.indexOf('/api/prestamos/evaluar') === 0) {
        const q = new URLSearchParams(url.split('?')[1] || '');
        return localApi.evaluarPrestamo(q.get('idEstudiante'), q.get('idLibro'));
      }
      throw new Error('Ruta no soportada en modo local: ' + url);
    }

    async function api(url, options) {
      if (MODO_API === 'local') { setModo('local'); return routeLocal(url, options); }
      if (MODO_API === 'auto' && modoEfectivo === 'local') return routeLocal(url, options);

      try {
        const res = await fetch(url, options);
        const text = await res.text();
        let data = null;
        if (text) { try { data = JSON.parse(text); } catch (e) {} }
        if (!res.ok) throw new Error((data && (data.message || data.mensaje)) || 'Error ' + res.status);
        setModo('api');
        return data;
      } catch (err) {
        if (MODO_API === 'auto' && modoEfectivo !== 'api') {
          setModo('local');
          return routeLocal(url, options);
        }
        throw err;
      }
    }

    /* ============================================================
       3. CONTEXTOS
       ============================================================ */
    const ThemeContext = createContext(null);
    const ToastContext = createContext(null);
    const DataContext = createContext(null);
    const useTheme = () => useContext(ThemeContext);
    const useToast = () => useContext(ToastContext);
    const useData = () => useContext(DataContext);

    /* ============================================================
       4. PROVIDERS
       ============================================================ */
    function ThemeProvider({ children }) {
      const [dark, setDark] = useState(function () {
        try { return localStorage.getItem(LS_TEMA) === 'dark'; } catch (e) { return false; }
      });
      useEffect(function () {
        const html = document.documentElement;
        if (dark) html.setAttribute('data-theme', 'dark'); else html.removeAttribute('data-theme');
        try { localStorage.setItem(LS_TEMA, dark ? 'dark' : 'light'); } catch (e) {}
      }, [dark]);
      return <ThemeContext.Provider value={{ dark: dark, toggle: function () { setDark(function (d) { return !d; }); } }}>{children}</ThemeContext.Provider>;
    }

    function ToastProvider({ children }) {
      const [toasts, setToasts] = useState([]);
      const idRef = useRef(0);
      const show = useCallback(function (message, type) {
        type = type || 'success';
        const id = ++idRef.current;
        setToasts(function (t) { return t.concat([{ id: id, message: message, type: type }]); });
        setTimeout(function () {
          setToasts(function (t) { return t.map(function (x) { return x.id === id ? Object.assign({}, x, { exiting: true }) : x; }); });
          setTimeout(function () { setToasts(function (t) { return t.filter(function (x) { return x.id !== id; }); }); }, 300);
        }, 3500);
      }, []);
      return (
        <ToastContext.Provider value={{ show: show }}>
          {children}
          <div className="toast-container" aria-live="polite">
            {toasts.map(function (t) {
              return (
                <div key={t.id} className={'toast ' + t.type + (t.exiting ? ' exiting' : '')}>
                  <i className={'fa-solid ' + (t.type === 'success' ? 'fa-check-circle' : 'fa-circle-exclamation')}></i>
                  <span>{t.message}</span>
                </div>
              );
            })}
          </div>
        </ToastContext.Provider>
      );
    }

    function DataProvider({ children }) {
      const [libros, setLibros] = useState([]);
      const [estudiantes, setEstudiantes] = useState([]);
      const [prestamos, setPrestamos] = useState([]);
      const [loadingLibros, setLoadingLibros] = useState(true);
      const [errorLibros, setErrorLibros] = useState(null);
      const [portadas, setPortadas] = useState(function () {
        try { return JSON.parse(localStorage.getItem(LS_PORTADAS) || '{}') || {}; } catch (e) { return {}; }
      });

      const guardarPortada = useCallback(function (id, url) {
        setPortadas(function (prev) {
          const next = Object.assign({}, prev);
          if (url) next[id] = url; else delete next[id];
          try { localStorage.setItem(LS_PORTADAS, JSON.stringify(next)); } catch (e) {}
          return next;
        });
      }, []);

      const cargarLibros = useCallback(async function () {
        setLoadingLibros(true); setErrorLibros(null);
        try {
          const data = await api('/libros');
          setLibros(Array.isArray(data) ? data : []);
        } catch (err) {
          setErrorLibros(err.message || 'No se pudieron cargar los libros');
        } finally { setLoadingLibros(false); }
      }, []);

      const cargarEstudiantes = useCallback(async function () {
        try {
          const data = await api('/estudiantes');
          setEstudiantes(Array.isArray(data) ? data : []);
        } catch (e) { setEstudiantes([]); }
      }, []);

      useEffect(function () { cargarLibros(); cargarEstudiantes(); }, [cargarLibros, cargarEstudiantes]);

      const crearLibro = useCallback(async function (data) {
        const nuevo = await api('/libros', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
        await cargarLibros();
        return nuevo;
      }, [cargarLibros]);

      const editarLibro = useCallback(async function (id, data) {
        const res = await api('/libros/' + id, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
        await cargarLibros();
        return res;
      }, [cargarLibros]);

      const eliminarLibro = useCallback(async function (id) {
        await api('/libros/' + id, { method: 'DELETE' });
        await cargarLibros();
      }, [cargarLibros]);

      const crearEstudiante = useCallback(async function (data) {
        const nuevo = await api('/estudiantes', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
        await cargarEstudiantes();
        return nuevo;
      }, [cargarEstudiantes]);

      const evaluarPrestamo = useCallback(async function (idEstudiante, idLibro) {
        const url = '/api/prestamos/evaluar?idEstudiante=' + encodeURIComponent(idEstudiante) + '&idLibro=' + encodeURIComponent(idLibro);
        const data = await api(url);
        if (data && data.autorizado) {
          const est = estudiantes.find(function (e) { return String(e.id) === String(idEstudiante); });
          const lib = libros.find(function (l) { return String(l.id) === String(idLibro); });
          setPrestamos(function (p) { return p.concat([{
            id: Date.now(),
            estudianteNombre: est ? est.nombre : 'Desconocido',
            libroId: lib ? lib.id : null,
            libroTitulo: lib ? lib.titulo : 'Desconocido',
            fecha: new Date().toLocaleDateString('es-PE'),
            estado: 'Activo'
          }]); });
          await cargarLibros();
        }
        return data;
      }, [estudiantes, libros, cargarLibros]);

      const devolverPrestamo = useCallback(function (id) {
        setPrestamos(function (p) { return p.filter(function (x) { return x.id !== id; }); });
      }, []);

      const value = {
        libros: libros, estudiantes: estudiantes, prestamos: prestamos, portadas: portadas,
        loadingLibros: loadingLibros, errorLibros: errorLibros,
        cargarLibros: cargarLibros, cargarEstudiantes: cargarEstudiantes,
        crearLibro: crearLibro, editarLibro: editarLibro, eliminarLibro: eliminarLibro,
        crearEstudiante: crearEstudiante, evaluarPrestamo: evaluarPrestamo, devolverPrestamo: devolverPrestamo,
        guardarPortada: guardarPortada
      };
      return <DataContext.Provider value={value}>{children}</DataContext.Provider>;
    }

    /* ============================================================
       5. UI BÁSICA
       ============================================================ */
    function AnimatedNumber({ value }) {
      const [display, setDisplay] = useState(value);
      const prevRef = useRef(value);
      useEffect(function () {
        const start = prevRef.current, end = value;
        if (start === end) { setDisplay(end); return; }
        const t0 = performance.now(), dur = 700;
        let raf;
        function step(t) {
          const p = Math.min((t - t0) / dur, 1);
          setDisplay(Math.round(start + (end - start) * (1 - Math.pow(1 - p, 3))));
          if (p < 1) raf = requestAnimationFrame(step);
        }
        raf = requestAnimationFrame(step);
        prevRef.current = end;
        return function () { cancelAnimationFrame(raf); };
      }, [value]);
      return <span>{display}</span>;
    }

    function BookCover({ book, size, overrideUrl }) {
      size = size || 'md';
      const { portadas } = useData();
      const url = overrideUrl !== undefined ? overrideUrl : (portadas[book.id] || '');
      const style = {}; style['--h'] = tono(book.titulo || book.id);
      return (
        <div className={'cover cover-' + size} style={style}>
          <span className="cover-spine"></span>
          <i className={'fa-solid ' + iconoCategoria(book.categoria) + ' cover-icon'}></i>
          <span className="cover-title">{book.titulo || 'Sin título'}</span>
          <span className="cover-author">{book.autor || ''}</span>
          {url ? <img src={url} alt={'Portada de ' + book.titulo} loading="lazy" referrerPolicy="no-referrer" onError={function (e) { e.currentTarget.remove(); }} /> : null}
        </div>
      );
    }

    function Avatar({ name, size }) {
      size = size || 34;
      const style = {}; style['--h'] = tono(name); style.width = size; style.height = size; style.fontSize = Math.round(size * 0.35);
      return <span className="avatar" style={style}>{iniciales(name)}</span>;
    }

    function Modal({ open, onClose, title, children, maxWidth, titleId }) {
      const ref = useRef(null);
      useEffect(function () {
        if (!open) return;
        function onKey(e) { if (e.key === 'Escape') onClose(); }
        document.addEventListener('keydown', onKey);
        const first = ref.current ? ref.current.querySelector('input, select, button') : null;
        if (first) first.focus();
        return function () { document.removeEventListener('keydown', onKey); };
      }, [open, onClose]);
      if (!open) return null;
      return (
        <div className="modal-overlay" role="dialog" aria-modal="true" aria-labelledby={titleId}
             onMouseDown={function (e) { if (e.target === e.currentTarget) onClose(); }}>
          <div className="modal" style={{ maxWidth: maxWidth || 720 }} ref={ref}>
            <div className="modal-header">
              <h2 id={titleId}>{title}</h2>
              <button className="close-btn" type="button" onClick={onClose} aria-label="Cerrar">
                <i className="fa-solid fa-xmark"></i>
              </button>
            </div>
            {children}
          </div>
        </div>
      );
    }

    /* ============================================================
       6. SIDEBAR (con indicador de modo)
       ============================================================ */
    function Sidebar({ tab, setTab }) {
      const { libros, prestamos } = useData();
      const { dark, toggle } = useTheme();
      const [modo, setModoState] = useState(modoEfectivo);

      useEffect(function () {
        setModoState(modoEfectivo);
        return suscribirModo(setModoState);
      }, []);

      const items = [
        { id: 'dashboard', icon: 'fa-chart-pie', label: 'Dashboard' },
        { id: 'catalogo', icon: 'fa-book', label: 'Catálogo', badge: libros.length },
        { id: 'prestamos', icon: 'fa-hand-holding-hand', label: 'Préstamos', badge: prestamos.length }
      ];
      return (
        <aside className="sidebar">
          <div className="sidebar-header">
            <div className="logo"><i className="fa-solid fa-book-open"></i></div>
            BiblioTech
          </div>
          <nav className="nav-menu" aria-label="Navegación principal">
            {items.map(function (it) {
              return (
                <button key={it.id} type="button"
                  className={'nav-item' + (tab === it.id ? ' active' : '')}
                  onClick={function () { setTab(it.id); }}
                  aria-current={tab === it.id ? 'page' : undefined}>
                  <i className={'fa-solid ' + it.icon}></i>
                  {it.label}
                  {it.badge !== undefined ? <span className="nav-badge">{it.badge}</span> : null}
                </button>
              );
            })}
          </nav>
          <div className="theme-toggle">
            <div className="mode-badge">
              <i className={'fa-solid fa-database'} style={{ color: modo === 'api' ? '#10b981' : '#f59e0b' }}></i>
              <span>{modo === 'api' ? 'Backend conectado' : 'Modo local (navegador)'}</span>
              <button type="button" className="reset-btn" title="Restaurar datos demo"
                onClick={function () {
                  if (window.confirm('¿Restaurar los datos de demostración? Se perderán los cambios locales.')) {
                    resetDemoData();
                    window.location.reload();
                  }
                }}>
                <i className="fa-solid fa-rotate-left"></i>
              </button>
            </div>
            <button className="theme-btn" type="button" onClick={toggle}>
              <i className={'fa-solid ' + (dark ? 'fa-sun' : 'fa-moon')}></i>
              <span>{dark ? 'Modo Claro' : 'Modo Oscuro'}</span>
            </button>
          </div>
        </aside>
      );
    }

    /* ============================================================
       7. DASHBOARD
       ============================================================ */
    function HeroArt() {
      return (
        <svg viewBox="0 0 320 170" aria-hidden="true">
          <rect x="10" y="150" width="300" height="9" rx="4" fill="rgba(255,255,255,.55)" />
          <g>
            <rect className="book-float" x="30" y="62" width="30" height="88" rx="4" fill="#fde047" />
            <rect className="book-float" x="64" y="38" width="34" height="112" rx="4" fill="#f472b6" />
            <rect className="book-float" x="102" y="74" width="28" height="76" rx="4" fill="#38bdf8" />
            <rect className="book-float" x="134" y="48" width="36" height="102" rx="4" fill="#34d399" />
            <rect className="book-float" x="174" y="68" width="30" height="82" rx="4" fill="#fb923c" />
          </g>
          <g stroke="rgba(255,255,255,.55)" strokeWidth="3" strokeLinecap="round">
            <line x1="40" y1="80" x2="50" y2="80" /><line x1="74" y1="62" x2="88" y2="62" />
            <line x1="112" y1="92" x2="120" y2="92" /><line x1="146" y1="70" x2="160" y2="70" />
            <line x1="184" y1="86" x2="194" y2="86" />
          </g>
          <rect x="214" y="92" width="30" height="58" rx="4" transform="rotate(14 214 150)" fill="#a78bfa" />
          <circle cx="272" cy="52" r="24" fill="#fef9c3" opacity=".95" />
          <path d="M262 52h20M272 42v20" stroke="#f59e0b" strokeWidth="3" strokeLinecap="round" />
          <rect x="256" y="118" width="40" height="32" rx="6" fill="#fb7185" />

    function BookTable({ books, onEditar, onEliminar }) {
      const [sort, setSort] = useState({ key: null, dir: 1 });
      const sorted = useMemo(function () {
        if (!sort.key) return books;
        const getters = {
          id: function (l) { return l.id; },
          titulo: function (l) { return String(l.titulo || '').toLowerCase(); },
          autor: function (l) { return String(l.autor || '').toLowerCase(); },
          categoria: function (l) { return String(categoriaDe(l)).toLowerCase(); },
          anio: function (l) { return l.anio || 0; },
          stock: function (l) { return stockDe(l); }
        };
        return books.slice().sort(function (a, b) {
          const va = getters[sort.key](a), vb = getters[sort.key](b);
          return va < vb ? -sort.dir : va > vb ? sort.dir : 0;
        });
      }, [books, sort]);
      function toggleSort(key) {
        setSort(function (s) { return s.key === key ? { key: key, dir: -s.dir } : { key: key, dir: 1 }; });
      }
      function Th({ k, children }) {
        return (
          <th className="sortable" onClick={function () { toggleSort(k); }}>
            {children}
            {sort.key === k ? <i className={'fa-solid fa-caret-' + (sort.dir > 0 ? 'up' : 'down')}></i> : null}
          </th>
        );
      }
      if (books.length === 0) {
        return (
          <div className="card"><div className="table-container"><table><tbody>
            <tr><td className="empty-state"><i className="fa-solid fa-book-open"></i>Ningún libro coincide con los filtros</td></tr>
          </tbody></table></div></div>
        );
      }
      return (
        <div className="card">
          <div className="table-container">
            <table>
              <thead>
                <tr>
                  <Th k="id">ID</Th>
                  <Th k="titulo">Libro</Th>
                  <Th k="autor">Autor</Th>
                  <Th k="categoria">Categoría</Th>
                  <Th k="anio">Año</Th>
                  <Th k="stock">Stock</Th>
                  <th>Acciones</th>
                </tr>
              </thead>
              <tbody>
                {sorted.map(function (libro) {
                  const b = stockBadge(stockDe(libro));
                  return (
                    <tr key={libro.id}>
                      <td>{libro.id}</td>
                      <td><div className="cell-book"><BookCover book={libro} size="sm" /><span>{libro.titulo}</span></div></td>
                      <td>{libro.autor}</td>
                      <td><span className="tag">{categoriaDe(libro)}</span></td>
                      <td>{libro.anio}</td>
                      <td><span className={'badge ' + b.cls}>{b.label}</span></td>
                      <td>
                        <div className="acciones">
                          <button className="btn btn-warning btn-icon" type="button" onClick={function () { onEditar(libro); }} aria-label={'Editar ' + libro.titulo}>
                            <i className="fa-solid fa-pen"></i>
                          </button>
                          <button className="btn btn-danger btn-icon" type="button" onClick={function () { onEliminar(libro); }} aria-label={'Eliminar ' + libro.titulo}>
                            <i className="fa-solid fa-trash"></i>
                          </button>
                        </div>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    function BookModal({ open, onClose, book, onSave }) {
      const isEdit = !!(book && book.id);
      const { portadas } = useData();
      const [form, setForm] = useState({ titulo: '', autor: '', categoria: '', anio: '', stock: 50, portada: '' });
      const [errors, setErrors] = useState({});
      const [saving, setSaving] = useState(false);

      useEffect(function () {
        if (!open) return;
        if (isEdit) {
          setForm({
            titulo: book.titulo || '', autor: book.autor || '', categoria: book.categoria || '',
            anio: book.anio || '', stock: stockDe(book), portada: portadas[book.id] || ''
          });
        } else {
          setForm({ titulo: '', autor: '', categoria: '', anio: '', stock: 50, portada: '' });
        }
        setErrors({});
      }, [open, book, isEdit, portadas]);

      function set(k, v) { setForm(function (f) { const n = Object.assign({}, f); n[k] = v; return n; }); }

      function validar() {
        const e = {};
        const anioMax = new Date().getFullYear() + 1;
        if (!form.titulo.trim()) e.titulo = 'El título es obligatorio';
        if (!form.autor.trim()) e.autor = 'El autor es obligatorio';
        if (form.anio !== '' && (!Number.isInteger(Number(form.anio)) || Number(form.anio) < 1 || Number(form.anio) > anioMax)) {
          e.anio = 'Año entre 1 y ' + anioMax;
        }
        if (form.stock === '' || !Number.isInteger(Number(form.stock)) || Number(form.stock) < 0) {
          e.stock = 'Ingrese un entero mayor o igual a 0';
        }
        if (form.portada && !/^https?:\/\/\S+$/i.test(form.portada)) {
          e.portada = 'Debe empezar con http:// o https://';
        }
        setErrors(e);
        return Object.keys(e).length === 0;
      }

      async function submit() {
        if (!validar()) return;
        setSaving(true);
        try {
          const payload = {
            titulo: form.titulo.trim(),
            autor: form.autor.trim(),
            categoria: form.categoria.trim(),
            anio: Number.isFinite(parseInt(form.anio, 10)) ? parseInt(form.anio, 10) : 0,
            stock: parseInt(form.stock, 10)
          };
          await onSave(payload, form.portada, isEdit ? book.id : null);
          onClose();
        } finally { setSaving(false); }
      }

      const previewBook = {
        id: (book && book.id) || 'nuevo',
        titulo: form.titulo.trim() || 'Título del libro',
        autor: form.autor.trim() || 'Autor',
        categoria: form.categoria
      };
      const validUrl = /^https?:\/\//i.test(form.portada) ? form.portada : '';

      return (
        <Modal open={open} onClose={onClose} title={isEdit ? 'Editar Libro' : 'Agregar Nuevo Libro'} titleId="modal-title">
          <div className="modal-body">
            <div className="modal-preview">
              <BookCover book={previewBook} size="lg" overrideUrl={validUrl} />
              <span className="field-hint" style={{ textAlign: 'center' }}>Vista previa de la portada</span>
            </div>
            <div>
              <div className="form-group">
                <label htmlFor="f-titulo">Título del libro *</label>
                <input id="f-titulo" className={errors.titulo ? 'invalid' : ''} type="text"
                  value={form.titulo} onChange={function (e) { set('titulo', e.target.value); }}
                  maxLength={150} placeholder="Ej. Cien Años de Soledad" />
                {errors.titulo ? <span className="field-error">{errors.titulo}</span> : null}
              </div>
              <div className="form-group">
                <label htmlFor="f-autor">Autor *</label>
                <input id="f-autor" className={errors.autor ? 'invalid' : ''} type="text"
                  value={form.autor} onChange={function (e) { set('autor', e.target.value); }}
                  maxLength={100} placeholder="Ej. Gabriel García Márquez" />
                {errors.autor ? <span className="field-error">{errors.autor}</span> : null}
              </div>
              <div className="form-group">
                <label htmlFor="f-categoria">Categoría</label>
                <input id="f-categoria" type="text" value={form.categoria}
                  onChange={function (e) { set('categoria', e.target.value); }} maxLength={60} placeholder="Ej. Novela" />
              </div>
              <div className="form-row">
                <div className="form-group">
                  <label htmlFor="f-anio">Año</label>
                  <input id="f-anio" className={errors.anio ? 'invalid' : ''} type="number"
                    value={form.anio} onChange={function (e) { set('anio', e.target.value); }} placeholder="Ej. 1967" />
                  {errors.anio ? <span className="field-error">{errors.anio}</span> : null}
                </div>
                <div className="form-group">
                  <label htmlFor="f-stock">Stock (ejemplares)</label>
                  <input id="f-stock" className={errors.stock ? 'invalid' : ''} type="number" min="0" step="1"
                    value={form.stock} onChange={function (e) { set('stock', e.target.value); }} />
                  {errors.stock ? <span className="field-error">{errors.stock}</span> : null}
                </div>
              </div>
              <div className="form-group">
                <label htmlFor="f-portada">Imagen de portada (URL, opcional)</label>
                <input id="f-portada" className={errors.portada ? 'invalid' : ''} type="url"
                  value={form.portada} onChange={function (e) { set('portada', e.target.value); }}
                  placeholder="https://... (si la dejas vacía se genera una portada)" />
                {errors.portada ? <span className="field-error">{errors.portada}</span> : null}
                <span className="field-hint">La imagen se guarda solo en este navegador.</span>
              </div>
            </div>
          </div>
          <div className="modal-actions">
            <button className="btn btn-secondary" type="button" onClick={onClose}>Cancelar</button>
            <button className="btn btn-primary" type="button" onClick={submit} disabled={saving}>
              {saving ? <span><i className="fa-solid fa-spinner spinner"></i> Guardando...</span> : 'Guardar Libro'}
            </button>
          </div>
        </Modal>
      );
    }

    function StudentModal({ open, onClose, onSave, existingNames }) {
      const [nombre, setNombre] = useState('');
      const [carrera, setCarrera] = useState('');
      const [error, setError] = useState('');
      const [saving, setSaving] = useState(false);

      useEffect(function () {
        if (open) { setNombre(''); setCarrera(''); setError(''); }
      }, [open]);

      async function submit() {
        const n = nombre.trim().replace(/\s+/g, ' ');
        if (n.length < 3) { setError('Escribe el nombre completo (mínimo 3 letras)'); return; }
        if (existingNames.some(function (x) { return x.toLowerCase() === n.toLowerCase(); })) {
          setError('Ya existe un estudiante con ese nombre'); return;
        }
        setSaving(true);
        try {
          await onSave(n, carrera.trim());
          onClose();
        } catch (err) {
          setError(err.message || 'No se pudo agregar');
        } finally { setSaving(false); }
      }

      return (
        <Modal open={open} onClose={onClose} title="Nuevo estudiante" titleId="student-title" maxWidth={460}>
          <div className="preview-row" style={{ justifyContent: 'center' }}>
            <Avatar name={nombre.trim() || '?'} size={72} />
          </div>
          <div className="form-group">
            <label htmlFor="s-nombre">Nombre completo *</label>
            <input id="s-nombre" className={error ? 'invalid' : ''} type="text"
              value={nombre} onChange={function (e) { setNombre(e.target.value); setError(''); }}
              maxLength={80} placeholder="Ej. María Quispe Mamani" autoComplete="off" />
            {error ? <span className="field-error">{error}</span> : null}
          </div>
          <div className="form-group">
            <label htmlFor="s-carrera">Carrera o programa (opcional)</label>
            <input id="s-carrera" type="text" value={carrera}
              onChange={function (e) { setCarrera(e.target.value); }} maxLength={80}
              placeholder="Ej. Desarrollo de Sistemas de Información" autoComplete="off" />
          </div>
          <div className="modal-actions">
            <button className="btn btn-secondary" type="button" onClick={onClose}>Cancelar</button>
            <button className="btn btn-primary" type="button" onClick={submit} disabled={saving}>
              {saving ? <span><i className="fa-solid fa-spinner spinner"></i> Guardando...</span> : <span><i className="fa-solid fa-user-plus"></i> Agregar estudiante</span>}
            </button>
          </div>
        </Modal>
      );

    function Catalog({ onPrestarLibro }) {
      const data = useData();
      const toast = useToast();
      const [searchInput, setSearchInput] = useState('');
      const [searchQuery, setSearchQuery] = useState('');
      const [filtro, setFiltro] = useState('');
      const [orden, setOrden] = useState('id');
      const [vista, setVista] = useState(function () {
        try { return localStorage.getItem(LS_VISTA) === 'tabla' ? 'tabla' : 'grid'; } catch (e) { return 'grid'; }
      });
      const [categoriaActiva, setCategoriaActiva] = useState('');
      const [bookModal, setBookModal] = useState({ open: false, book: null });
      const [confirm, setConfirm] = useState({ open: false, book: null, confirming: false });

      useEffect(function () {
        const t = setTimeout(function () { setSearchQuery(searchInput); }, 250);
        return function () { clearTimeout(t); };
      }, [searchInput]);

      useEffect(function () { try { localStorage.setItem(LS_VISTA, vista); } catch (e) {} }, [vista]);

      const categorias = useMemo(function () {
        const conteo = {};
        data.libros.forEach(function (l) { const c = categoriaDe(l); conteo[c] = (conteo[c] || 0) + 1; });
        return Object.entries(conteo).sort(function (a, b) { return a[0].localeCompare(b[0], 'es'); });
      }, [data.libros]);

      useEffect(function () {
        if (categoriaActiva && !categorias.some(function (c) { return c[0] === categoriaActiva; })) {
          setCategoriaActiva('');
        }
      }, [categorias, categoriaActiva]);

      const filtrados = useMemo(function () {
        const q = searchQuery.trim().toLowerCase();
        const lista = data.libros.filter(function (l) {
          const s = stockDe(l);
          const okTexto = !q || [l.titulo, l.autor, l.categoria].some(function (c) { return String(c || '').toLowerCase().indexOf(q) !== -1; });
          const okCat = !categoriaActiva || categoriaDe(l) === categoriaActiva;
          const okStock = !filtro || (filtro === 'disponible' && s > 5) || (filtro === 'bajo' && s > 0 && s <= 5) || (filtro === 'agotado' && s <= 0);
          return okTexto && okCat && okStock;
        });
        const comparadores = {
          id: function (a, b) { return (a.id || 0) - (b.id || 0); },
          titulo: function (a, b) { return String(a.titulo || '').localeCompare(String(b.titulo || ''), 'es'); },
          autor: function (a, b) { return String(a.autor || '').localeCompare(String(b.autor || ''), 'es'); },
          anio: function (a, b) { return (b.anio || 0) - (a.anio || 0); },
          stockAsc: function (a, b) { return stockDe(a) - stockDe(b); },
          stockDesc: function (a, b) { return stockDe(b) - stockDe(a); }
        };
        return lista.slice().sort(comparadores[orden] || comparadores.id);
      }, [data.libros, searchQuery, categoriaActiva, filtro, orden]);

      async function handleSave(payload, portada, idEditando) {
        try {
          let saved;
          if (idEditando) {
            saved = await data.editarLibro(idEditando, payload);
            data.guardarPortada(idEditando, portada);
            toast.show('Libro actualizado exitosamente');
          } else {
            saved = await data.crearLibro(payload);
            if (saved && saved.id) data.guardarPortada(saved.id, portada);
            toast.show('Libro guardado exitosamente');
          }
        } catch (err) {
          toast.show('No se pudo guardar: ' + err.message, 'error');
          throw err;
        }
      }

      async function handleEliminar() {
        if (!confirm.book) return;
        setConfirm(function (c) { return Object.assign({}, c, { confirming: true }); });
        try {
          await data.eliminarLibro(confirm.book.id);
          data.guardarPortada(confirm.book.id, '');
          toast.show('Libro eliminado correctamente');
          setConfirm({ open: false, book: null, confirming: false });
        } catch (err) {
          toast.show('No se pudo eliminar: ' + err.message, 'error');
          setConfirm(function (c) { return Object.assign({}, c, { confirming: false }); });
        }
      }

      return (
        <section className="page-section">
          <div className="page-header">
            <div>
              <h1 className="page-title">Catálogo de Libros</h1>
              <p className="page-sub">Busca, filtra y administra tus libros</p>
            </div>
            <button className="btn btn-primary" type="button" onClick={function () { setBookModal({ open: true, book: null }); }}>
              <i className="fa-solid fa-plus"></i> Agregar Libro
            </button>
          </div>

          <Toolbar search={searchInput} onSearch={setSearchInput}
            filtro={filtro} onFiltro={setFiltro}
            orden={orden} onOrden={setOrden}
            vista={vista} onVista={setVista} />

          <div className="chips">
            <button type="button" className={'chip-btn' + (categoriaActiva === '' ? ' active' : '')}
              onClick={function () { setCategoriaActiva(''); }}>Todas ({data.libros.length})</button>
            {categorias.map(function (c) {
              return (
                <button key={c[0]} type="button"
                  className={'chip-btn' + (categoriaActiva === c[0] ? ' active' : '')}
                  onClick={function () { setCategoriaActiva(c[0]); }}>
                  {c[0]} ({c[1]})
                </button>
              );
            })}
          </div>

          <p className="result-count">Mostrando {filtrados.length} de {data.libros.length} libros</p>

          {data.loadingLibros ? (
            <div className="books-grid">
              {Array.from({ length: 8 }).map(function (_, i) {
                return (
                  <div key={i} className="sk-card">
                    <div className="skeleton sk-cover"></div>
                    <div className="skeleton sk-line"></div>
                    <div className="skeleton sk-line short"></div>
                  </div>
                );
              })}
            </div>
          ) : data.errorLibros ? (
            <div className="empty-state" style={{ color: 'var(--danger)' }}>
              <i className="fa-solid fa-triangle-exclamation"></i>
              {data.errorLibros}
              <div style={{ marginTop: 14 }}>
                <button className="btn btn-secondary btn-sm" type="button" onClick={data.cargarLibros}>
                  Reintentar
                </button>
              </div>
            </div>
          ) : vista === 'grid' ? (
            <div className="books-grid">
              {filtrados.length === 0
                ? <div className="empty-state" style={{ gridColumn: '1/-1' }}>
                    <i className="fa-solid fa-book-open"></i>
                    {data.libros.length === 0 ? 'No hay libros en el catálogo' : 'Ningún libro coincide con los filtros'}
                  </div>
                : filtrados.map(function (l, i) {
                  return (
                    <BookCard key={l.id} book={l} index={i}
                      onPrestar={onPrestarLibro}
                      onEditar={function (b) { setBookModal({ open: true, book: b }); }}
                      onEliminar={function (b) { setConfirm({ open: true, book: b, confirming: false }); }} />
                  );
                })}
            </div>
          ) : (
            <BookTable books={filtrados}
              onEditar={function (b) { setBookModal({ open: true, book: b }); }}
              onEliminar={function (b) { setConfirm({ open: true, book: b, confirming: false }); }} />
          )}

          <BookModal open={bookModal.open} book={bookModal.book}
            onClose={function () { setBookModal({ open: false, book: null }); }}
            onSave={handleSave} />

          <ConfirmModal open={confirm.open}
            onClose={function () { setConfirm({ open: false, book: null, confirming: false }); }}
            onConfirm={handleEliminar} confirming={confirm.confirming}
            title="Eliminar libro"
            message={confirm.book ? '¿Seguro que deseas eliminar "' + confirm.book.titulo + '"? Esta acción no se puede deshacer.' : ''} />
        </section>
      );
    }

    /* ============================================================
       9. PRÉSTAMOS
       ============================================================ */
    function LoanPreview({ studentId, bookId }) {
      const { libros, estudiantes } = useData();
      const est = estudiantes.find(function (e) { return String(e.id) === String(studentId); });
      const libro = libros.find(function (l) { return String(l.id) === String(bookId); });

      if (!est && !libro) {
        return (
          <div className="card preview-box">
            <div className="empty-state">
              <i className="fa-solid fa-clipboard-list"></i>
              Selecciona un estudiante y un libro para ver el resumen del préstamo
            </div>
          </div>
        );
      }
      const maxStock = Math.max.apply(null, [1].concat(libros.map(stockDe)));
      let libroInfo = null;
      if (libro) {
        const s = stockDe(libro);
        const color = s <= 0 ? 'var(--danger)' : s <= 5 ? 'var(--warning)' : 'var(--success)';
        libroInfo = (
          <div className="preview-row">
            <BookCover book={libro} size="md" />
            <div style={{ flex: 1, minWidth: 160 }}>
              <strong>{libro.titulo}</strong><br />
              <span className="field-hint">{libro.autor} · {categoriaDe(libro)}</span>
              <div className="stock-meter">
                <span style={{ width: Math.round(s / maxStock * 100) + '%', background: color }}></span>
              </div>
              <span className="field-hint">Stock disponible: <strong style={{ color: color }}>{s}</strong></span>
            </div>
          </div>
        );
      }
      return (
        <div className="card preview-box">
          <h3 style={{ fontSize: 16, marginBottom: 16 }}>Resumen del préstamo</h3>
          {est ? (
            <div className="preview-row">
              <Avatar name={est.nombre} size={52} />
              <div>
                <strong>{est.nombre}</strong><br />
                <span className="field-hint">{est.carrera || 'Estudiante'} · ID {est.id}</span>
              </div>
            </div>
          ) : null}
          {libroInfo}
        </div>
      );
    }

    function Loans({ preselectBookId, clearPreselect, setStudentModalOpen }) {
      const data = useData();
      const toast = useToast();
      const [idEstudiante, setIdEstudiante] = useState('');
      const [libroId, setLibroId] = useState('');
      const [evaluando, setEvaluando] = useState(false);

      useEffect(function () {
        if (preselectBookId !== null && preselectBookId !== undefined) {
          setLibroId(String(preselectBookId));
          clearPreselect();
        }
      }, [preselectBookId, clearPreselect]);

      async function evaluar() {
        if (!idEstudiante) { toast.show('Seleccione un estudiante', 'error'); return; }
        if (!libroId) { toast.show('Seleccione un libro', 'error'); return; }
        setEvaluando(true);
        try {
          const res = await data.evaluarPrestamo(idEstudiante, libroId);
          if (res && res.autorizado) toast.show(res.mensaje || 'Préstamo autorizado');
          else toast.show((res && res.mensaje) || 'Préstamo no autorizado', 'error');
        } catch (err) {
          toast.show('Error al conectar con el servidor: ' + err.message, 'error');
        } finally { setEvaluando(false); }
      }

      function devolver(id) {
        data.devolverPrestamo(id);
        toast.show('Devolución registrada correctamente');
      }

      return (
        <section className="page-section">
          <div className="page-header">
            <div>
              <h1 className="page-title">Gestión de Préstamos</h1>
              <p className="page-sub">Evalúa y registra nuevos préstamos</p>
            </div>
          </div>

          <div className="loan-layout">
            <div className="card" style={{ marginBottom: 0 }}>
              <div className="card-header">
                <h3 style={{ fontSize: 16, display: 'flex', alignItems: 'center', gap: 8 }}>
                  <i className="fa-solid fa-file-signature" style={{ color: 'var(--primary)' }}></i> Nuevo Préstamo
                </h3>
              </div>
              <div style={{ padding: 24 }}>
                <div className="form-group">
                  <div className="label-row">
                    <label htmlFor="idEstudiante">Estudiante solicitante</label>
                    <button className="link-btn" type="button" onClick={function () { setStudentModalOpen(true); }}>
                      <i className="fa-solid fa-user-plus"></i> Nuevo estudiante
                    </button>
                  </div>
                  <select id="idEstudiante" value={idEstudiante} onChange={function (e) { setIdEstudiante(e.target.value); }}>
                    <option value="">Seleccione un estudiante...</option>
                    {data.estudiantes.map(function (e) {
                      return <option key={e.id} value={e.id}>{e.nombre} (ID: {e.id})</option>;
                    })}
                  </select>
                </div>
                <div className="form-group">
                  <label htmlFor="libroId">Libro solicitado</label>
                  <select id="libroId" value={libroId} onChange={function (e) { setLibroId(e.target.value); }}>
                    <option value="">Seleccione un libro...</option>
                    {data.libros.map(function (l) {
                      const s = stockDe(l);
                      return <option key={l.id} value={l.id} disabled={s <= 0}>{l.titulo} (Stock: {s})</option>;
                    })}
                  </select>
                </div>
                <button className="btn btn-primary" type="button" onClick={evaluar} disabled={evaluando} style={{ width: '100%' }}>
                  {evaluando
                    ? <span><i className="fa-solid fa-spinner spinner"></i> Evaluando...</span>
                    : <span><i className="fa-solid fa-check-circle"></i> Evaluar y Prestar</span>}
                </button>
              </div>
            </div>
            <LoanPreview studentId={idEstudiante} bookId={libroId} />
          </div>

          <div className="card" style={{ marginTop: 24 }}>
            <div className="card-header">
              <h3 style={{ fontSize: 16, display: 'flex', alignItems: 'center', gap: 8 }}>
                <i className="fa-solid fa-list-check" style={{ color: 'var(--success)' }}></i> Préstamos de esta sesión
              </h3>
            </div>
            <div className="table-container">
              <table>
                <thead>
                  <tr><th>Estudiante</th><th>Libro</th><th>Fecha</th><th>Estado</th><th>Acciones</th></tr>
                </thead>
                <tbody>
                  {data.prestamos.length === 0 ? (
                    <tr><td colSpan={5} className="empty-state">
                      <i className="fa-solid fa-clipboard-list"></i>No hay préstamos registrados hoy
                    </td></tr>
                  ) : data.prestamos.map(function (p) {
                    const lib = data.libros.find(function (l) { return String(l.id) === String(p.libroId); }) || { id: p.libroId, titulo: p.libroTitulo };
                    return (
                      <tr key={p.id}>
                        <td><div className="cell-book"><Avatar name={p.estudianteNombre} />{p.estudianteNombre}</div></td>
                        <td><div className="cell-book"><BookCover book={lib} size="sm" /><span>{p.libroTitulo}</span></div></td>
                        <td>{p.fecha}</td>
                        <td><span className="badge ok">{p.estado}</span></td>
                        <td>
                          <button className="btn btn-danger btn-icon" type="button" onClick={function () { devolver(p.id); }}
                            title="Registrar devolución" aria-label="Registrar devolución">
                            <i className="fa-solid fa-rotate-left"></i>
                          </button>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        </section>
      );
    }

    /* ============================================================
       10. ERROR BOUNDARY
       ============================================================ */
    class ErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { error: null }; }
      static getDerivedStateFromError(error) { return { error: error }; }
      componentDidCatch(error, info) { console.error('ErrorBoundary:', error, info); }
      render() {
        if (this.state.error) {
          return (
            <div style={{ padding: 40, textAlign: 'center', width: '100%' }}>
              <i className="fa-solid fa-triangle-exclamation" style={{ fontSize: 48, color: 'var(--danger)' }}></i>
              <h2 style={{ margin: '16px 0' }}>Algo salió mal</h2>
              <p style={{ color: 'var(--text-muted)', marginBottom: 20 }}>{String(this.state.error)}</p>
              <button className="btn btn-primary" onClick={function () { location.reload(); }}>Recargar</button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    /* ============================================================
       11. APP
       ============================================================ */
    function App() {
      const { estudiantes, crearEstudiante } = useData();
      const [tab, setTabState] = useState(function () {
        const h = window.location.hash.replace('#', '');
        return ['dashboard', 'catalogo', 'prestamos'].indexOf(h) !== -1 ? h : 'dashboard';
      });
      const [preselectBookId, setPreselectBookId] = useState(null);
      const [studentModalOpen, setStudentModalOpen] = useState(false);

      useEffect(function () {
        function onHash() {
          const h = window.location.hash.replace('#', '');
          if (['dashboard', 'catalogo', 'prestamos'].indexOf(h) !== -1) setTabState(h);
        }
        window.addEventListener('hashchange', onHash);
        return function () { window.removeEventListener('hashchange', onHash); };
      }, []);

      function setTab(id) {
        setTabState(id);
        window.location.hash = id;
        const mc = document.querySelector('.main-content');
        if (mc) mc.scrollTo({ top: 0 });
      }

      function handlePrestarLibro(id) {
        setPreselectBookId(id);
        setTab('prestamos');
      }

      async function handleSaveStudent(nombre, carrera) {
        const data = { nombre: nombre };
        if (carrera) data.carrera = carrera;
        await crearEstudiante(data);
      }

      return (
        <ErrorBoundary>
          <Sidebar tab={tab} setTab={setTab} />
          <main className="main-content">
            {tab === 'dashboard' ? <Dashboard setTab={setTab} /> : null}
            {tab === 'catalogo' ? <Catalog onPrestarLibro={handlePrestarLibro} /> : null}
            {tab === 'prestamos' ? (
              <Loans
                preselectBookId={preselectBookId}
                clearPreselect={function () { setPreselectBookId(null); }}
                setStudentModalOpen={setStudentModalOpen}
              />
            ) : null}
          </main>
          <StudentModal
            open={studentModalOpen}
            onClose={function () { setStudentModalOpen(false); }}
            onSave={handleSaveStudent}
            existingNames={estudiantes.map(function (e) { return String(e.nombre || '').trim(); })}
          />
        </ErrorBoundary>
      );
    }

    /* ============================================================
       12. BOOT
       ============================================================ */
    try {
      // Inicializar store demo en el primer arranque
      initStore();
      setModo(MODO_API === 'local' ? 'local' : null);

      ReactDOM.createRoot(document.getElementById('root')).render(
        <ThemeProvider>
          <ToastProvider>
            <DataProvider>
              <App />
            </DataProvider>
          </ToastProvider>
        </ThemeProvider>
      );
    } catch (err) {
      console.error('Error al renderizar:', err);
      document.getElementById('root').innerHTML =
        '<div style="padding:40px;font-family:sans-serif;color:#e11d48">' +
        '<h2>Error al iniciar React</h2><pre>' + String(err && err.stack || err) + '</pre></div>';
    }
</script>
</body>
</html>
